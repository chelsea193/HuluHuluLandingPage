    <!-- Webfonts, loaded off the critical path. `preload as=style` fetches the
         sheet at high priority without blocking render; the onload swap turns it
         into a real stylesheet once it lands, and `display=swap` means text is
         painted in the fallback face meanwhile. Only the two families the page
         actually uses are requested — Ma Shan Zheng, Inter and JetBrains Mono
         were declared but never applied to any element. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300..900&family=Noto+Serif+SC:wght@300..900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300..900&family=Noto+Serif+SC:wght@300..900&display=swap">
    </noscript>
